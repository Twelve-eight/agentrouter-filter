<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网关用量统计</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e9ef;
    --dim: #8b93a7; --accent: #5aa9ff; --ok: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--dim); margin-bottom: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  select, button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .s { color: var(--dim); font-size: 11px; margin-top: 2px; }
  section { margin-bottom: 24px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #1d212a; color: var(--dim); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1b1f28; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .dim { color: var(--dim); }
  .bar { height: 6px; background: var(--accent); border-radius: 3px; min-width: 2px; }
  .barwrap { background: #1d212a; border-radius: 3px; width: 90px; display: inline-block; vertical-align: middle; }
  code { background: #1d212a; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  #err { color: var(--bad); margin-bottom: 12px; }
</style>
</head>
<body>
<h1>网关用量统计</h1>
<div class="sub">
  数据来源:上游返回的 <code>usage</code> 字段,逐请求记录.<br>
  <b>成本是参考估算,不是实付</b>:取<b>模型厂商官方挂牌价</b>(models.db 里 openai/deepseek/moonshot/zai/google 等厂商条目,USD/1M tokens),含缓存读写分档,长上下文档位(&gt;272K 输入)与闲时折扣.我们的上游是转售商,实付价无从得知;同一模型在不同转售商处可差 2x.没有官方价格的模型显示 <code>-</code> -- 不按 0 计算,避免合计静默偏低.
</div>

<div class="row">
  <label>范围
    <select id="days">
      <option value="1">今天</option>
      <option value="7" selected>最近 7 天</option>
      <option value="30">最近 30 天</option>
      <option value="90">最近 90 天</option>
      <option value="365">最近一年</option>
    </select>
  </label>
  <button id="refresh">刷新</button>
  <span class="dim" id="stamp"></span>
</div>

<div id="err"></div>

<div class="cards" id="cards"></div>

<section>
  <h2>按渠道</h2>
  <table id="providers"></table>
</section>

<section>
  <h2>按模型</h2>
  <table id="models"></table>
</section>

<section>
  <h2>按日期</h2>
  <table id="daily"></table>
</section>

<section>
  <h2>最近请求</h2>
  <table id="recent"></table>
</section>

<script>
const n = (v) => (v ?? 0).toLocaleString("en-US");
const ms = (v) => (v ? (v / 1000).toFixed(1) + "s" : "-");
const pct = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "-");
// Cost is only shown when the row had a published price. Unpriced requests are
// counted separately rather than shown as $0.00, which would read as "free".
const usd = (v) => "$" + (v ?? 0).toFixed(v < 0.01 ? 6 : 4);
const costCell = (r) => r.cost_usd
  ? usd(r.cost_usd) + (r.priced_requests < r.requests ? ' <span class="dim">(' + r.priced_requests + "/" + r.requests + ")</span>" : "")
  : '<span class="dim">-</span>';

function table(el, cols, rows) {
  const t = document.getElementById(el);
  const head = "<tr>" + cols.map((c) => "<th>" + c.h + "</th>").join("") + "</tr>";
  if (!rows.length) {
    t.innerHTML = head + '<tr><td colspan="' + cols.length + '" class="dim">(无数据)</td></tr>';
    return;
  }
  t.innerHTML = head + rows.join("");
}

function bar(value, max) {
  const w = max ? Math.max(2, Math.round((value / max) * 88)) : 0;
  return '<span class="barwrap"><span class="bar" style="width:' + w + 'px;display:inline-block"></span></span>';
}

function render(d) {
  const t = d.summary.totals;
  document.getElementById("cards").innerHTML = [
    ["请求数", n(t.requests), t.failed + " 失败"],
    ["输入 tokens", n(t.input_tokens), ""],
    ["输出 tokens", n(t.output_tokens), ""],
    ["推理 tokens", n(t.reasoning_tokens), "输出的一部分"],
    ["缓存命中", n(t.cached_tokens), "input 的一部分"],
    ["累计成本(估)", t.cost_usd ? usd(t.cost_usd) : "-", t.priced_requests + "/" + t.requests + " 请求有官方价"],
    ["总耗时", ms(t.duration_ms), t.requests ? "均值 " + ms(t.duration_ms / t.requests) : ""],
  ].map(([k, v, s]) =>
    '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + "</div></div>"
  ).join("");

  const maxP = Math.max(1, ...d.summary.byProvider.map((r) => r.input_tokens + r.output_tokens));
  table("providers", [
    { h: "渠道" }, { h: "请求" }, { h: "成功" }, { h: "输入" }, { h: "输出" }, { h: "推理" }, { h: "成本" }, { h: "占比" }, { h: "耗时" },
  ], d.summary.byProvider.map((r) => "<tr>" +
    "<td>" + r.key + "</td>" +
    "<td>" + n(r.requests) + "</td>" +
    '<td class="' + (r.failed ? "bad" : "ok") + '">' + n(r.ok) + "</td>" +
    "<td>" + n(r.input_tokens) + "</td>" +
    "<td>" + n(r.output_tokens) + "</td>" +
    '<td class="dim">' + n(r.reasoning_tokens) + "</td>" +
    "<td>" + costCell(r) + "</td>" +
    "<td>" + bar(r.input_tokens + r.output_tokens, maxP) + " " + pct(r.input_tokens + r.output_tokens, maxP) + "</td>" +
    '<td class="dim">' + ms(r.duration_ms) + "</td>" +
  "</tr>"));

  const maxM = Math.max(1, ...d.summary.byModel.map((r) => r.input_tokens + r.output_tokens));
  table("models", [
    { h: "模型" }, { h: "请求" }, { h: "输入" }, { h: "输出" }, { h: "推理" }, { h: "成本" }, { h: "占比" }, { h: "耗时" },
  ], d.summary.byModel.map((r) => "<tr>" +
    "<td>" + r.key + "</td>" +
    "<td>" + n(r.requests) + "</td>" +
    "<td>" + n(r.input_tokens) + "</td>" +
    "<td>" + n(r.output_tokens) + "</td>" +
    '<td class="dim">' + n(r.reasoning_tokens) + "</td>" +
    "<td>" + costCell(r) + "</td>" +
    "<td>" + bar(r.input_tokens + r.output_tokens, maxM) + "</td>" +
    '<td class="dim">' + ms(r.duration_ms) + "</td>" +
  "</tr>"));

  table("daily", [
    { h: "日期" }, { h: "请求" }, { h: "输入" }, { h: "输出" }, { h: "推理" },
  ], d.summary.byDay.map((r) => "<tr>" +
    "<td>" + r.key + "</td>" +
    "<td>" + n(r.requests) + "</td>" +
    "<td>" + n(r.input_tokens) + "</td>" +
    "<td>" + n(r.output_tokens) + "</td>" +
    '<td class="dim">' + n(r.reasoning_tokens) + "</td>" +
  "</tr>"));

  table("recent", [
    { h: "时间" }, { h: "渠道" }, { h: "模型" }, { h: "状态" }, { h: "输入" }, { h: "输出" }, { h: "推理" }, { h: "成本" }, { h: "耗时" },
  ], d.recent.map((r) => "<tr>" +
    '<td class="dim">' + (r.ts ?? "").replace("T", " ").slice(5, 19) + "</td>" +
    "<td>" + (r.provider ?? "-") + "</td>" +
    "<td>" + (r.model ?? "-") + "</td>" +
    '<td class="' + (r.ok ? "ok" : "bad") + '">' + (r.ok ? "ok" : r.status ?? "err") + "</td>" +
    "<td>" + n(r.input_tokens) + "</td>" +
    "<td>" + n(r.output_tokens) + "</td>" +
    '<td class="dim">' + n(r.reasoning_tokens) + "</td>" +
    "<td>" + (r.cost ? usd(r.cost.total) : '<span class="dim">-</span>') + "</td>" +
    '<td class="dim">' + ms(r.duration_ms) + "</td>" +
  "</tr>"));
}

async function load() {
  const days = document.getElementById("days").value;
  document.getElementById("err").textContent = "";
  try {
    const r = await fetch("/stats/data?days=" + days);
    if (!r.ok) throw new Error("HTTP " + r.status);
    // Bind the payload: `d` is used below for the price-source note, and
    // referencing an unbound `d` threw a ReferenceError that the catch
    // swallowed - showing "读取失败: d is not defined" over a table that had
    // in fact rendered correctly.
    const d = await r.json();
    render(d);
    document.getElementById("stamp").textContent =
      "更新于 " + new Date().toLocaleTimeString() + (d.pricing ? " - 价格源: " + d.pricing : "");
  } catch (e) {
    document.getElementById("err").textContent = "读取失败: " + e.message;
  }
}

document.getElementById("refresh").addEventListener("click", load);
document.getElementById("days").addEventListener("change", load);
load();
setInterval(load, 30000);
</script>
</body>
</html>
